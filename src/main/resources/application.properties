spring.application.name=spring-boot-training
server.servlet.context-path=/spring-boot-training
logging.level.com.springboot.training=DEBUG
#logging.level.com.springboot.training.fitler.RequestTimingFilter=DEBUG

# Expose the endpoints used in the demo
management.endpoints.web.exposure.include=*

# Health: show components and details
management.endpoint.health.show-details=always

# Info: publish app details
management.info.env.enabled=true
info.app.name=Employee API
info.app.version=1.0.0
info.app.description=Spring Boot training demo

# H2 in-memory DB (PostgreSQL compatibility mode, same SQL as the databases course)
spring.datasource.url=jdbc:h2:mem:trainingdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql + data.sql from src/main/resources on startup
spring.sql.init.mode=always

# Tables come from schema.sql; Hibernate only checks the entities against them
spring.jpa.hibernate.ddl-auto=validate

# Show generated SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console