spring.application.name=spring-jpa-training
server.servlet.context-path=/spring-jpa-training
logging.level.com.springjpa.training=DEBUG
#logging.level.com.springjpa.training.fitler.RequestTimingFilter=DEBUG

# Expose the endpoints used in the demo
management.endpoints.web.exposure.include=*

# Health: show components and details
management.endpoint.health.show-details=always

# Info: publish app details
management.info.env.enabled=true
info.app.name=Employee API
info.app.version=1.0.0
info.app.description=Spring Boot training demo

# H2 in-memory DB (PostgreSQL compatibility mode, same SQL as the databases course)
spring.datasource.url=jdbc:h2:mem:trainingdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=


# --- SQL script initialization ---
#Run the scripts on every startup.
spring.sql.init.mode=always
#Loads only schema.sql / data.sql
spring.sql.init.platform=all
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
spring.sql.init.separator=;

# --- JPA ---
#Hibernate checks the entity against the database tables
spring.jpa.hibernate.ddl-auto=validate
#Run scripts before Hibernate.
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/<context-path>h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console