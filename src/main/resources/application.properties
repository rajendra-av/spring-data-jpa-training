spring.application.name=spring-boot-training
server.servlet.context-path=/spring-boot-training
logging.level.com.springboot.training=DEBUG
#logging.level.com.springboot.training.fitler.RequestTimingFilter=DEBUG

# Expose the endpoints used in the demo
management.endpoints.web.exposure.include=*

# Health: show components and details
management.endpoint.health.show-details=always

# Info: publish app details
management.info.env.enabled=true
info.app.name=Employee API
info.app.version=1.0.0
info.app.description=Spring Boot training demo
